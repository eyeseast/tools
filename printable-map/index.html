<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Printable Map &middot; Roslindale, MA</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      crossorigin="anonymous"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        color: #222;
        background: #f4f4f4;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .panel {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 10;
        background: white;
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        padding: 14px 16px;
        width: 240px;
      }

      .panel h1 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #333;
      }

      .panel label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }

      .panel select,
      .panel button {
        width: 100%;
        font-size: 14px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: white;
        margin-bottom: 10px;
        font-family: inherit;
      }

      .panel button {
        background: #2b6cb0;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .panel button:hover {
        background: #2c5282;
      }

      .panel button:disabled {
        background: #a0aec0;
        cursor: wait;
      }

      .panel .hint {
        font-size: 11px;
        color: #888;
        line-height: 1.4;
      }

      .output {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .output.visible {
        display: flex;
        flex-direction: column;
      }

      .output img {
        max-width: 100%;
        max-height: calc(100% - 64px);
        background: white;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      .output-actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
      }

      .output-actions a,
      .output-actions button {
        font-size: 14px;
        padding: 9px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
        font-family: inherit;
      }

      .output-actions .download {
        background: #38a169;
        color: white;
      }

      .output-actions .print {
        background: #2b6cb0;
        color: white;
      }

      .output-actions .close {
        background: #e2e8f0;
        color: #2d3748;
      }

      @media print {
        .panel,
        .maplibregl-control-container {
          display: none !important;
        }

        .output {
          background: white;
          padding: 0;
        }

        .output img {
          max-width: 100%;
          max-height: 100%;
          box-shadow: none;
        }

        .output-actions {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div class="panel">
      <h1>Printable Map &mdash; Roslindale</h1>
      <label for="style">Style</label>
      <select id="style">
        <option value="light">Light</option>
        <option value="grayscale">Grayscale</option>
        <option value="white">White</option>
        <option value="black">Black</option>
        <option value="dark">Dark</option>
      </select>
      <button id="export">Generate image</button>
      <p class="hint">
        Pan and zoom to frame the map, then generate a PNG to download or
        print.
      </p>
    </div>

    <div class="output" id="output">
      <img id="map-image" alt="Generated map" />
      <div class="output-actions">
        <a id="download" class="download" download="roslindale-map.png">Download PNG</a>
        <button id="print" class="print">Print</button>
        <button id="close" class="close">Back to map</button>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/@protomaps/basemaps@5.0.0/dist/basemaps.js"></script>
    <script>
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      const PMTILES_URL = "pmtiles://./roslindale.pmtiles";

      function buildStyle(flavorName) {
        return {
          version: 8,
          glyphs:
            "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
          sprite:
            "https://protomaps.github.io/basemaps-assets/sprites/v4/" +
            flavorName,
          sources: {
            protomaps: {
              type: "vector",
              url: PMTILES_URL,
              attribution: '<a href="https://protomaps.com">Protomaps</a>',
            },
          },
          layers: basemaps.layers(
            "protomaps",
            basemaps.namedFlavor(flavorName),
            { lang: "en" }
          ),
        };
      }

      const map = new maplibregl.Map({
        container: "map",
        style: buildStyle("light"),
        center: [-71.13, 42.285],
        zoom: 13,
        minZoom: 11,
        maxZoom: 16,
        preserveDrawingBuffer: true,
        maxBounds: [
          [-71.18, 42.24],
          [-71.08, 42.33],
        ],
        hash: true,
      });

      map.addControl(new maplibregl.NavigationControl(), "top-left");
      map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-left");

      document.getElementById("style").addEventListener("change", (e) => {
        map.setStyle(buildStyle(e.target.value));
      });

      const exportBtn = document.getElementById("export");
      const output = document.getElementById("output");
      const mapImage = document.getElementById("map-image");
      const downloadLink = document.getElementById("download");

      exportBtn.addEventListener("click", async () => {
        exportBtn.disabled = true;
        exportBtn.textContent = "Generating...";
        try {
          map.triggerRepaint();
          await new Promise((resolve) => map.once("idle", resolve));
          const dataUrl = map.getCanvas().toDataURL("image/png");
          mapImage.src = dataUrl;
          downloadLink.href = dataUrl;
          output.classList.add("visible");
        } catch (err) {
          console.error(err);
          alert("Could not generate image: " + err.message);
        } finally {
          exportBtn.disabled = false;
          exportBtn.textContent = "Generate image";
        }
      });

      document.getElementById("close").addEventListener("click", () => {
        output.classList.remove("visible");
      });

      document.getElementById("print").addEventListener("click", () => {
        window.print();
      });
    </script>
  </body>
</html>
